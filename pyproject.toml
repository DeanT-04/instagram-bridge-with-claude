[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "heliograph"
version = "0.1.0"
description = "Heliograph: a local Instagram <-> Claude bridge (MCP) with built-in observability."
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Heliograph contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27,<1",
    "playwright>=1.45,<2",
    "mcp>=1.2,<2",
    "faster-whisper>=1.0,<2",
    "pillow>=10.3",
    "imagehash>=4.3,<5",
    "uiautomation>=2.0.20; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    # faster-whisper needs onnxruntime, which stopped shipping Intel-macOS wheels after
    # 1.23: pin the last release that has them there (other platforms stay on latest).
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime>=1.24; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.scripts]
heliograph = "heliograph.cli:app"

[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime>=1.4.4",
]
ocr-windows = [
    "winrt-windows-foundation>=2 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=2 ; sys_platform == 'win32'",
    "winrt-windows-globalization>=2 ; sys_platform == 'win32'",
    "winrt-windows-graphics-imaging>=2 ; sys_platform == 'win32'",
    "winrt-windows-media-ocr>=2 ; sys_platform == 'win32'",
    "winrt-windows-security-cryptography>=2 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=2 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/heliograph"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "ASYNC109"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that touch the real device, network or Instagram (deselect with -m 'not live')",
    "slow: tests that download/run ML models (e.g. Whisper); deselect with -m 'not slow'",
]
addopts = "-m 'not live'"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["heliograph"]
ignore_missing_imports = true
