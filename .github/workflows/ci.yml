name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  UV_PYTHON: "3.12"

jobs:
  lint:
    name: Lint & types (${{ matrix.os }})
    # mypy runs on every OS: platform-specific code (ctypes.windll, winreg...) is guarded
    # with `sys.platform` checks so strict type-checking is clean everywhere.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy (strict)
        run: uv run mypy

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      # ocr-windows (winrt-*), uiautomation and pywin32 carry `sys_platform == 'win32'`
      # markers, so --all-extras is safe on Linux/macOS.
      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: CLI smoke test
        run: |
          uv run heliograph --help
          uv run heliograph version

      # live = touches a real device/account; slow = downloads Whisper models.
      - name: Pytest
        run: uv run pytest -m "not live and not slow" -q
