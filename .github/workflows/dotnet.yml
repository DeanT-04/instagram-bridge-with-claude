name: .NET

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Heliograph.slnx
      - name: Build
        run: dotnet build Heliograph.slnx --no-restore -warnaserror
      - name: Format
        run: dotnet format Heliograph.slnx --no-restore --verify-no-changes
      - name: Test
        run: dotnet test Heliograph.slnx --no-build
      # Native AOT needs a platform linker (MSVC on Windows, clang elsewhere): prove the runners have one.
      - name: Publish the AOT probe
        run: dotnet publish tests/Heliograph.Core.Probe -c Release
