name: Bug report
description: Something in Heliograph doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste cookies, tokens, passwords or other people's data.**
        For security vulnerabilities, use private reporting instead (see docs/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `uv run heliograph ...`
        2. Ask Claude to ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Live-app driver (UIA)
        - Deep driver (CDP)
        - Media pipeline / dossiers
        - MCP server
        - The Eye (observability)
        - CLI / setup
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `uv run heliograph doctor`
      render: text
  - type: textarea
    id: eye
    attributes:
      label: Output of `uv run heliograph eye report` (optional)
      description: The Eye redacts secrets, but please double-check before pasting.
      render: text
  - type: input
    id: version
    attributes:
      label: Heliograph version or commit
      placeholder: "0.1.0 / abc1234"
  - type: input
    id: os
    attributes:
      label: OS and browser
      placeholder: "Windows 11 24H2, Edge 1xx"
